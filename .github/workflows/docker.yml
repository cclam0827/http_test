name: Build & Push Docker Image

on:
  push:
    branches: [main]
    # Doc-only changes don't need a new image.
    paths-ignore:
      - "**.md"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Push-to-push on main cancels the older in-flight build.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # needed to push to ghcr.io with GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No QEMU needed: the Dockerfile cross-compiles natively and its final
      # stage has no RUN. Add docker/setup-qemu-action if you ever add one.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One build, one multi-arch tag: `docker pull` picks the right architecture.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cclam0827/http_test:latest
            ghcr.io/cclam0827/http_test:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
